name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements-nodeps.txt

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned static ffmpeg 7
        if: runner.os == 'Linux'
        env:
          FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-07-31-14-10/ffmpeg-n7.1.5-12-g1fdbca85aa-linux64-gpl-7.1.tar.xz
          FFMPEG_SHA256: c1e6caf48923dd8e6bc5e54d51ba70c321175b8162ae9c414c392990e72f0e79
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/ffmpeg.tar.xz "$FFMPEG_URL"
          echo "$FFMPEG_SHA256  /tmp/ffmpeg.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/.local"
          tar -xJf /tmp/ffmpeg.tar.xz -C "$HOME/.local"
          bin_dir="$(find "$HOME/.local" -maxdepth 2 -type d -name bin | head -n 1)"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Install ffmpeg from Homebrew
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg

      - name: Install Python pins
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install -r backend/requirements-dev.txt
          python -m pip install --no-deps -r backend/requirements-nodeps.txt

      - name: Install frontend pins
        working-directory: frontend
        run: npm ci

      - name: Check pins
        run: python .github/workflows/check_pins.py

      - name: Check ffmpeg 7
        run: |
          set -euo pipefail
          ffmpeg -version
          ffprobe -version
          ffmpeg -version | head -n 1 | grep -E 'ffmpeg version n?[7-9]\.'

      - name: Install pinned shellcheck
        if: runner.os == 'Linux'
        env:
          SHELLCHECK_URL: https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/shellcheck.tar.xz "$SHELLCHECK_URL"
          echo "$SHELLCHECK_SHA256  /tmp/shellcheck.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          install -m 0755 /tmp/shellcheck-v0.11.0/shellcheck "$HOME/.local/bin/shellcheck"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/shellcheck" --version | grep -F '0.11.0'

      - name: Shellcheck
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          shellcheck --version | grep -F '0.11.0'
          shellcheck -x scripts/gpu/*.sh scripts/sync_volume.sh docker/gpu/entrypoint.sh

      - name: Ruff
        if: hashFiles('backend/app/**/*.py') != ''
        run: ruff check backend ml scripts/export_labels.py scripts/download_models.py

      - name: Mypy
        if: hashFiles('backend/app/**/*.py') != ''
        run: |
          set -euo pipefail
          mypy backend/app
          mypy --ignore-missing-imports ml

      - name: Pytest unmarked and media
        if: hashFiles('backend/tests/**/*.py') != ''
        run: >
          pytest backend/tests
          -m "not model and not gpu and not macos and not golden and not slow"

      - name: Vitest
        if: hashFiles('frontend/src/**/*') != ''
        working-directory: frontend
        run: npm test

      - name: Frontend build
        if: hashFiles('frontend/src/**/*') != ''
        working-directory: frontend
        run: npm run build

      - name: Playwright browsers
        if: hashFiles('frontend/e2e/**/*') != ''
        working-directory: frontend
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "macOS" ]; then
            npx playwright install --with-deps chromium webkit
          else
            npx playwright install --with-deps chromium
          fi

      - name: Playwright Chromium
        if: hashFiles('frontend/e2e/**/*') != ''
        working-directory: frontend
        run: npx playwright test --project=chromium

      - name: Playwright WebKit
        if: runner.os == 'macOS' && hashFiles('frontend/e2e/**/*') != ''
        working-directory: frontend
        run: npx playwright test --project=webkit

  pod-layout:
    name: pod-layout /tmp/cc-src
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements-nodeps.txt

      - name: Install Python pins
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install -r backend/requirements-dev.txt
          python -m pip install --no-deps -r backend/requirements-nodeps.txt

      - name: Install pinned shellcheck
        env:
          SHELLCHECK_URL: https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/shellcheck.tar.xz "$SHELLCHECK_URL"
          echo "$SHELLCHECK_SHA256  /tmp/shellcheck.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          install -m 0755 /tmp/shellcheck-v0.11.0/shellcheck "$HOME/.local/bin/shellcheck"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/shellcheck" --version | grep -F '0.11.0'

      - name: Pytest gpu_tests selection from /tmp/cc-src
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/cc/venv/bin
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'echo "ERROR: fake /opt/cc/venv/bin/python used" >&2' \
            'echo OPT_CC_PYTHON >&2' \
            'exit 42' | sudo tee /opt/cc/venv/bin/python >/dev/null
          sudo chmod 755 /opt/cc/venv/bin/python
          rm -rf /tmp/cc-src
          cp -a "$GITHUB_WORKSPACE" /tmp/cc-src
          cd /tmp/cc-src
          while IFS= read -r key; do
            unset "$key"
          done < <(env | awk -F= '/^(CC_|RUNPOD_)/ {print $1}')
          pytest backend/tests -m "not macos" --tb=short
