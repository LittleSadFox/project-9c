name: GPU image

on:
  push:
    paths:
      - "docker/gpu/**"
      - "backend/requirements.txt"
      - "backend/requirements-gpu.txt"
      - "backend/requirements-dev.txt"
      - "backend/requirements-nodeps.txt"
      - "scripts/gpu/**"
      - ".github/workflows/gpu-image.yml"
  pull_request:
    paths:
      - "docker/gpu/**"
      - "backend/requirements.txt"
      - "backend/requirements-gpu.txt"
      - "backend/requirements-dev.txt"
      - "backend/requirements-nodeps.txt"
      - "scripts/gpu/**"
      - ".github/workflows/gpu-image.yml"
  workflow_dispatch:

concurrency:
  group: gpu-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  gpu-image:
    name: Build climbing-coach-gpu
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image names
        id: image
        run: |
          set -euo pipefail
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          name="ghcr.io/${repo}/climbing-coach-gpu"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${name}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "latest_tag=${name}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "latest_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/gpu/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ${{ steps.image.outputs.sha_tag }}
            climbing-coach-gpu:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke the image
        run: |
          set -euo pipefail
          IMAGE=climbing-coach-gpu:ci
          docker run --rm --entrypoint /opt/cc/venv/bin/python "$IMAGE" -c \
            "import onnxruntime, sys; assert onnxruntime.__version__=='1.23.2', onnxruntime.__version__; print(onnxruntime.__version__)"
          docker run --rm --entrypoint /opt/cc/venv/bin/python "$IMAGE" -c \
            "import importlib.util, sys; bad=['torch','mmpose','mmcv','torchvision']; sys.exit(1 if any(importlib.util.find_spec(n) for n in bad) else 0)"
          docker run --rm --entrypoint ffmpeg "$IMAGE" -version | head -n 1 | grep -E 'ffmpeg version n?[7-9]\.'
          docker run --rm --entrypoint python3 "$IMAGE" --version | grep -E 'Python 3\.12\.'
          docker run --rm --entrypoint bash "$IMAGE" -lc 'test -x /usr/sbin/sshd && command -v git && command -v curl && command -v jq'

      - name: Push sha and latest
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          docker tag climbing-coach-gpu:ci "${{ steps.image.outputs.sha_tag }}"
          docker push "${{ steps.image.outputs.sha_tag }}"
          if [[ -n "${{ steps.image.outputs.latest_tag }}" ]]; then
            docker tag climbing-coach-gpu:ci "${{ steps.image.outputs.latest_tag }}"
            docker push "${{ steps.image.outputs.latest_tag }}"
          fi
