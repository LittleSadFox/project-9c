[pytest]
pythonpath = . ..
testpaths = tests
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
markers =
    media: needs ffmpeg 7+
    model: needs ONNX weights
    gpu: needs CUDAExecutionProvider
    macos: needs CoreML or VideoToolbox on a Mac
    golden: needs labelled footage
    slow: omit from the default run
